[package]
name = "deetshealth-ehr"
version = "0.1.0"
description = "DeetsHealth's ehr service: the verify state, the patient binding and the scheduler, behind a gRPC wire to the agent."
authors = ["Aditya Sundaram"]
edition = "2021"
license = "MIT"
# Never on crates.io (an app's crate, not a library; deny.toml's bans read this).
publish = false

# docs/architecture/EHR-SERVICE.md.
[dependencies]
# Shielded<T> and the wire edge's pass (core/src/wire.rs). Without core's default `native-tls`:
# ehr never uses core's `Net`, and that feature would link OpenSSL on Linux. One TLS stack here,
# rustls on AWS-LC (DEPENDENCIES.md §5, item 6).
deetshealth-core = { path = "../core", default-features = false }
# The gRPC server and the generated code. `tls-connect-info` lets tonic serve our own TLS
# streams; tonic builds no TLS config of its own (transport.rs does).
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport", "tls-connect-info"] }
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1"
# mTLS, TLS 1.3 only, on AWS-LC. The `fips` feature below turns on its FIPS module
# (EHR-SERVICE.md §6; the owner, 2026-10-21).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Handles and slot tokens: 128 bits from the OS's random source.
getrandom = "0.4"
# Wipes a session's secrets when it closes.
zeroize = "1"
# The sandbox fixture (ehr/fixtures/sandbox.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The text message (texts.rs): Twilio's Messages API over rustls on the same AWS-LC provider
# as the wire, with Mozilla's roots. No provider of reqwest's own, so no ring. `form` for the
# Twilio request and Epic's token request (opt-in since 0.13).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
webpki-roots = "1"
# The Epic sign-in's JWT (epic.rs): base64url, no padding.
base64 = "0.23"
# Epic's visit times (epic_ehr.rs): an instant to the place's local time, with the time zone
# database built in (Windows has none that jiff reads).
jiff = "1.0"
# The call store (store.rs; DATABASE.md): Postgres, migrations embedded in the binary. No TLS
# feature yet: dev talks to 127.0.0.1. The cloud adds TLS on the same AWS-LC provider.
# Since 0.9 a query is `&'static str` only; SQL built at run time goes through `sql.rs`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
# Sealing the store's protected columns (seal_key.rs): AES-256-GCM and SHA-256 from AWS-LC, the
# provider the wire already uses. Under `fips`, its FIPS module.
aws-lc-rs = "1"

[features]
# The deploy build. Needs CMake and Go to build AWS-LC's FIPS module; not used on Windows dev.
fips = ["rustls/fips", "aws-lc-rs/fips"]

[build-dependencies]
# build.rs: the generated code, the walk over the descriptors, and the protoc pin
# (ehr/protoc.json: Google's own protoc, fetched by scripts/protoc.mjs; DEPENDENCIES.md §5).
serde_json = "1"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"

[dev-dependencies]
# examples/dev_certs.rs: the dev CA and the two certificates. Never in the service build.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# tests/transport.rs: a real mTLS client against the real server.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", default-features = false, features = ["tls-aws-lc", "transport"] }
