// The contract between the agent (Python) and `ehr` (Rust): docs/architecture/EHR-SERVICE.md.
//
// Rules for this file:
// - Every chart and booking call takes a handle, never a patient id. No message has a patient
//   field (SECURITY.md §4.9).
// - Mark each field that can carry protected data `(phi) = true`, and each field that is a
//   credential `(secret) = true`. Both marks keep the value out of every log and debug print
//   (EHR-SERVICE.md §4). When in doubt, mark it.
// - A breaking change gets a new package (v2). A field number is never reused.
// - No oneof in a message with a marked field (build.rs refuses it).

syntax = "proto3";

package deets.ehr.v1;

import "google/protobuf/descriptor.proto";

// 50000 to 99999 is the range protobuf leaves for in-house options.
extend google.protobuf.FieldOptions {
  // The field can carry PHI or PII (SECURITY.md §2).
  bool phi = 50001;
  // The field is a credential: a handle or a token. Not PHI, but it opens PHI.
  bool secret = 50002;
}

service Ehr {
  // Starts one call's session. Every other call names it by the handle in the reply.
  rpc OpenCall(OpenCallRequest) returns (OpenCallReply);
  // Ends the session and wipes it. Safe to call twice.
  rpc CloseCall(CloseCallRequest) returns (CloseCallReply);
  // The caller's name and date of birth (SECURITY.md §4.4). If exactly one patient matches,
  // a code goes to the number on file. The reply is the same whether or not one matched.
  rpc Identify(IdentifyRequest) returns (IdentifyReply);
  // Sends the code again, to the same number. The reply never says whether a code went out.
  rpc ResendCode(ResendCodeRequest) returns (ResendCodeReply);
  // The code the caller read back. PASS opens the chart and booking calls.
  rpc CheckCode(CheckCodeRequest) returns (CheckCodeReply);
  // Open slots for the verified caller. Refused before both factors pass.
  rpc FindSlots(FindSlotsRequest) returns (FindSlotsReply);
  // Books one slot from the last FindSlots. A retry with the same key gets the same answer.
  rpc Book(BookRequest) returns (BookReply);
  // The verified caller's next visit (DESIGN.md S5). Refused before both factors pass.
  rpc NextVisit(NextVisitRequest) returns (NextVisitReply);
  // Files one ended call's record into the call store (DATABASE.md), one line per message, so a
  // long call never meets the message limit. Keyed by the record's call id, not a handle: the
  // session is closed by then. FAILED_PRECONDITION when ehr runs without a store.
  rpc FileCall(stream FileCallLine) returns (FileCallReply);
  // The settings store (CONSOLE.md §7.3): versions of one service's settings, insert-only. Every
  // version holds every setting; each save is a new version and becomes the active one. No
  // field is protected data. FAILED_PRECONDITION when ehr runs without a store.
  rpc ListSettingVersions(ListSettingVersionsRequest) returns (ListSettingVersionsReply);
  // One version's settings: the active one when `version_id` is 0. No version yet: no values.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsReply);
  // Saves a whole set as a new version and makes it the active one. INVALID_ARGUMENT names the
  // setting that does not fit (settings.rs): its name, never its value.
  rpc SaveSettings(SaveSettingsRequest) returns (SaveSettingsReply);
}

// One saved version of a service's settings. Its label is "MM-DD | seq" (the owner's words), or
// "Default" for number 0, the code's defaults.
message SettingVersion {
  int64 id = 1;
  // The day it was saved, YYYY-MM-DD, on the database's clock.
  string day = 2;
  // Its number among that day's versions, from 1.
  int32 seq = 3;
  // When it was saved and became active, RFC 3339.
  string created_at = 4;
  // Who saved it: a staff id later; "dev" on a dev machine.
  string created_by = 5;
  // The one version the agent runs with now.
  bool active = 6;
}

// One setting: its name and its value as JSON.
message SettingValue {
  string key = 1;
  string value = 2;
}

message ListSettingVersionsRequest {
  // The service: `voice` (Cartesia). Each service has its own table (settings.rs).
  string service = 1;
}

message ListSettingVersionsReply {
  // Newest first, the Default version last.
  repeated SettingVersion versions = 1;
}

message GetSettingsRequest {
  string service = 1;
  // 0: the active version.
  int64 version_id = 2;
}

message GetSettingsReply {
  // Unset when the service has no version yet: the agent runs on its defaults.
  SettingVersion version = 1;
  repeated SettingValue values = 2;
}

message SaveSettingsRequest {
  string service = 1;
  // Every setting of the service, once each (settings.rs lists them).
  repeated SettingValue values = 2;
  string by = 3;
  // The Default version: number 0, at most one per service (ALREADY_EXISTS after that). It is
  // made active only when the service has no active version yet.
  bool seed = 4;
}

message SaveSettingsReply {
  SettingVersion version = 1;
}

message FileCallLine {
  // The record's id (its file name, without .jsonl). The same in every message of one stream.
  string call_id = 1;
  // One line of the record: a JSON event. The dev record keeps the call's words in full.
  string line = 2 [(phi) = true];
}

message FileCallReply {
  // False when the same record was already filed (the ingest is idempotent).
  bool filed = 1;
}

// Which EHR a call reads. It names a server, never a patient. A deploy serves its hospital's
// EHR only and refuses any other; dev serves both (CHAT.md §13).
enum EhrSource {
  // ehr's default: its own fakes today.
  EHR_SOURCE_UNSPECIFIED = 0;
  // ehr's fakes (ehr/fixtures/sandbox.json).
  EHR_SOURCE_LOCAL = 1;
  // Epic's public sandbox (EPIC.md §5.2). FAILED_PRECONDITION when ehr does not serve it.
  EHR_SOURCE_EPIC_SANDBOX = 2;
}

message OpenCallRequest {
  EhrSource ehr = 1;
  // The version of the agent's words this call runs with (CONSOLE.md §9): ehr takes the text
  // message's words (`text.code`) from it. 0: the prompt file compiled into ehr. A version id,
  // never words.
  int64 prompt_version = 2;
}

message OpenCallReply {
  string handle = 1 [(secret) = true];
  // This call's verification limits, in full (service.rs: MAX_IDENTIFIES, MAX_RESENDS,
  // MAX_CODE_FAILURES), so a reader never copies them. The replies that spend one say what is
  // left. Counts only, never a value.
  uint32 identifies_left = 2;
  uint32 resends_left = 3;
  uint32 code_tries_left = 4;
}

message CloseCallRequest {
  string handle = 1 [(secret) = true];
}

message CloseCallReply {}

message IdentifyRequest {
  string handle = 1 [(secret) = true];
  string given_name = 2 [(phi) = true];
  string family_name = 3 [(phi) = true];
  // YYYY-MM-DD.
  string birth_date = 4 [(phi) = true];
}

message IdentifyReply {
  // How many more times the caller may give a name and date of birth on this call.
  uint32 tries_left = 1;
}

message ResendCodeRequest {
  string handle = 1 [(secret) = true];
}

message ResendCodeReply {
  uint32 resends_left = 1;
}

message CheckCodeRequest {
  string handle = 1 [(secret) = true];
  // Six digits.
  string code = 2 [(secret) = true];
}

enum CheckOutcome {
  CHECK_OUTCOME_UNSPECIFIED = 0;
  // Both factors passed. The chart and booking calls are open.
  CHECK_OUTCOME_PASS = 1;
  // Wrong, expired, or no code was sent. The caller may try again.
  CHECK_OUTCOME_FAIL = 2;
  // Three failures: the chart path is closed for this call. Offer a person.
  CHECK_OUTCOME_LOCKED = 3;
}

message CheckCodeReply {
  CheckOutcome outcome = 1;
  uint32 tries_left = 2;
}

message FindSlotsRequest {
  string handle = 1 [(secret) = true];
  // What the visit is for, in the caller's words.
  string reason = 2 [(phi) = true];
  // The earliest day the caller can come, YYYY-MM-DD. Empty: from the next open day.
  string earliest_day = 3 [(phi) = true];
}

message FindSlotsReply {
  repeated Slot slots = 1;
}

message Slot {
  // Valid for this call's handle only, until the next FindSlots.
  string token = 1 [(secret) = true];
  // The start, local time at the place, YYYY-MM-DDTHH:MM.
  string starts_at = 2 [(phi) = true];
  uint32 minutes = 3;
  string clinician = 4 [(phi) = true];
  string place = 5 [(phi) = true];
}

message BookRequest {
  string handle = 1 [(secret) = true];
  string slot_token = 2 [(secret) = true];
  // Made by the agent, random, one per booking the caller asks for. A retry reuses it.
  string idempotency_key = 3;
}

enum BookOutcome {
  BOOK_OUTCOME_UNSPECIFIED = 0;
  BOOK_OUTCOME_BOOKED = 1;
  // Someone else took the slot between FindSlots and Book. Offer the others.
  BOOK_OUTCOME_SLOT_TAKEN = 2;
}

message BookReply {
  BookOutcome outcome = 1;
  // Set when the outcome is BOOKED.
  Slot booked = 2;
}

message NextVisitRequest {
  string handle = 1 [(secret) = true];
}

message Visit {
  // The start, local time at the place, YYYY-MM-DDTHH:MM.
  string starts_at = 1 [(phi) = true];
  uint32 minutes = 2;
  string clinician = 3 [(phi) = true];
  string place = 4 [(phi) = true];
  // The visit type as the record names it ("Office Visit"); "" when the record has none or
  // the visit is private.
  string visit_type = 5 [(phi) = true];
  // The reason for the visit; "" when the record has none or the visit is private.
  string reason = 6 [(phi) = true];
  // An online visit (video or phone). The place is still the record's.
  bool online = 7;
  // The type or reason named sensitive care (FUTURE-SETTINGS.md §9): both were dropped in ehr
  // and are "". The agent may say only that it cannot share what the visit is for.
  bool reason_private = 8;
}

message NextVisitReply {
  // Unset when the caller has no visit coming.
  Visit visit = 1;
}
