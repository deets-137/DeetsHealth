// The contract between the agent (Python) and `ehr` (Rust): docs/architecture/EHR-SERVICE.md.
//
// Rules for this file:
// - Every chart and booking call takes a handle, never a patient id. No message has a patient
//   field (SECURITY.md §4.9).
// - Mark each field that can carry protected data `(phi) = true`, and each field that is a
//   credential `(secret) = true`. Both marks keep the value out of every log and debug print
//   (EHR-SERVICE.md §4). When in doubt, mark it.
// - A breaking change gets a new package (v2). A field number is never reused.
// - No oneof in a message with a marked field (build.rs refuses it).

syntax = "proto3";

package deets.ehr.v1;

import "google/protobuf/descriptor.proto";

// 50000 to 99999 is the range protobuf leaves for in-house options.
extend google.protobuf.FieldOptions {
  // The field can carry PHI or PII (SECURITY.md §2).
  bool phi = 50001;
  // The field is a credential: a handle or a token. Not PHI, but it opens PHI.
  bool secret = 50002;
}

service Ehr {
  // Starts one call's session. Every other call names it by the handle in the reply.
  rpc OpenCall(OpenCallRequest) returns (OpenCallReply);
  // Ends the session and wipes it. Safe to call twice.
  rpc CloseCall(CloseCallRequest) returns (CloseCallReply);
  // The caller's name and date of birth (SECURITY.md §4.4). If exactly one patient matches,
  // a code goes to the number on file. The reply is the same whether or not one matched.
  rpc Identify(IdentifyRequest) returns (IdentifyReply);
  // Sends the code again, to the same number. The reply never says whether a code went out.
  rpc ResendCode(ResendCodeRequest) returns (ResendCodeReply);
  // The code the caller read back. PASS opens the chart and booking calls.
  rpc CheckCode(CheckCodeRequest) returns (CheckCodeReply);
  // Open slots for the verified caller. Refused before both factors pass.
  rpc FindSlots(FindSlotsRequest) returns (FindSlotsReply);
  // Books one slot from the last FindSlots. A retry with the same key gets the same answer.
  rpc Book(BookRequest) returns (BookReply);
  // One of the verified caller's visits (DESIGN.md S5; EPIC.md §7.10): the soonest to come, or
  // one the caller names by day, month, clinician, group or past. When too many match, the
  // groups to ask about. Refused before both factors pass.
  rpc FindVisit(FindVisitRequest) returns (FindVisitReply);
  // Files one ended call's record into the call store (DATABASE.md), one line per message, so a
  // long call never meets the message limit. Keyed by the record's call id, not a handle: the
  // session is closed by then. FAILED_PRECONDITION when ehr runs without a store.
  rpc FileCall(stream FileCallLine) returns (FileCallReply);
  // The settings store (CONSOLE.md §7.3): versions of one service's settings, insert-only. Every
  // version holds every setting; each save is a new version and becomes the active one. No
  // field is protected data. FAILED_PRECONDITION when ehr runs without a store.
  rpc ListSettingVersions(ListSettingVersionsRequest) returns (ListSettingVersionsReply);
  // One version's settings: the active one when `version_id` is 0. No version yet: no values.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsReply);
  // Saves a whole set as a new version and makes it the active one. INVALID_ARGUMENT names the
  // setting that does not fit (settings.rs): its name, never its value.
  rpc SaveSettings(SaveSettingsRequest) returns (SaveSettingsReply);
  // The people who may sign in to the console (docs/ops/DEMO.md §3.5; users.rs): the store is the
  // record, and the agent keeps Cloudflare's Access group in step. FAILED_PRECONDITION without a
  // store. Everyone on the list now, the owner first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersReply);
  // Puts a person on the list. The email or the name may be empty, not both (a card to fill in
  // later; with no email, no sign-in). ALREADY_EXISTS when the email is on it; INVALID_ARGUMENT
  // names the field that does not fit.
  rpc AddUser(AddUserRequest) returns (AddUserReply);
  // Takes a person off the list (the row stays, for audits) and returns their email.
  // NOT_FOUND for no such person; PERMISSION_DENIED for the owner.
  rpc RemoveUser(RemoveUserRequest) returns (RemoveUserReply);
  // Whether an email is on the list now; stamps when it was last seen.
  rpc AdmitUser(AdmitUserRequest) returns (AdmitUserReply);
  // Brings in the emails already in Cloudflare's group that the list lacks (users.rs › seed).
  rpc SeedUsers(SeedUsersRequest) returns (SeedUsersReply);
  // Saves a person's card (Security › Auth; users.rs › update): the whole profile at once.
  // INVALID_ARGUMENT names the field; NOT_FOUND for no such person; ALREADY_EXISTS when the new
  // email is someone else's (a removed person's too). The old email comes back when it changed.
  // Any field may be empty, but a saved email cannot be cleared.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserReply);
  // A person's picture, a sealed WebP: get, set, or clear (an empty `photo`). NOT_FOUND for no
  // such person; INVALID_ARGUMENT for a picture that is not a WebP of at most 256 KB.
  rpc GetUserPhoto(GetUserPhotoRequest) returns (UserPhoto);
  rpc SetUserPhoto(SetUserPhotoRequest) returns (SetUserPhotoReply);
  // The owner was seen: the console on the owner's PC (the launch token) stamps last seen.
  rpc SeenOwner(SeenOwnerRequest) returns (SeenOwnerReply);
}

// One person on the list. A staff member's identity, not a patient's, but marked: it never goes
// in a log.
message User {
  string id = 1;
  string email = 2 [(phi) = true];
  string name = 3 [(phi) = true];
  bool owner = 4;
  // The adder as "First L." (their email until their card has a name); empty for the owner and
  // for people brought in from Cloudflare's group.
  string added_by = 5 [(phi) = true];
  // RFC 3339, UTC.
  string added_at = 6;
  // RFC 3339, UTC; empty when never seen.
  string last_seen_at = 7;
  string first_name = 8 [(phi) = true];
  string last_name = 9 [(phi) = true];
  // E.164, or empty.
  string phone = 10 [(phi) = true];
  bool phone_verified = 11;
  // `access` or `idp`.
  string source = 12;
  // When the picture was saved, RFC 3339, UTC; empty when there is none.
  string photo_at = 13;
}

message UpdateUserRequest {
  string id = 1;
  string first_name = 2 [(phi) = true];
  string last_name = 3 [(phi) = true];
  string phone = 4 [(phi) = true];
  string email = 5 [(phi) = true];
}

message UpdateUserReply {
  // The email before the save; empty when it did not change, and when the card had none yet.
  string old_email = 1 [(phi) = true];
  // Whether the email changed: true too when a card with no email gets its first one.
  bool email_changed = 2;
}

message GetUserPhotoRequest {
  string id = 1;
}

// A picture travels as base64 text: only a string field can carry the PHI mark (build.rs).
message UserPhoto {
  // Base64 of the WebP's bytes; empty when there is no picture.
  string photo = 1 [(phi) = true];
}

message SetUserPhotoRequest {
  string id = 1;
  // Base64 of a WebP; empty clears the picture.
  string photo = 2 [(phi) = true];
}

message SetUserPhotoReply {}

message SeenOwnerRequest {}

message SeenOwnerReply {}

message ListUsersRequest {}

message ListUsersReply {
  repeated User users = 1;
}

message AddUserRequest {
  string email = 1 [(phi) = true];
  string name = 2 [(phi) = true];
  // The adder's email; empty for the console on the owner's PC.
  string by = 3 [(phi) = true];
}

message AddUserReply {
  string id = 1;
}

message RemoveUserRequest {
  string id = 1;
}

message RemoveUserReply {
  string email = 1 [(phi) = true];
}

message AdmitUserRequest {
  string email = 1 [(phi) = true];
}

message AdmitUserReply {
  bool active = 1;
}

message SeedUsersRequest {
  // Each in a message of its own: build.rs marks a single field, not a list of strings.
  repeated SeedEmail emails = 1;
}

message SeedEmail {
  string email = 1 [(phi) = true];
}

message SeedUsersReply {
  int32 added = 1;
}

// One saved version of a service's settings. Its label is "MM-DD | seq" (the owner's words), or
// "Default" for number 0, the code's defaults.
message SettingVersion {
  int64 id = 1;
  // The day it was saved, YYYY-MM-DD, on the database's clock.
  string day = 2;
  // Its number among that day's versions, from 1.
  int32 seq = 3;
  // When it was saved and became active, RFC 3339.
  string created_at = 4;
  // Who saved it: a staff id later; "dev" on a dev machine.
  string created_by = 5;
  // The one version the agent runs with now.
  bool active = 6;
}

// One setting: its name and its value as JSON.
message SettingValue {
  string key = 1;
  string value = 2;
}

message ListSettingVersionsRequest {
  // The service: `voice` (Cartesia). Each service has its own table (settings.rs).
  string service = 1;
}

message ListSettingVersionsReply {
  // Newest first, the Default version last.
  repeated SettingVersion versions = 1;
}

message GetSettingsRequest {
  string service = 1;
  // 0: the active version.
  int64 version_id = 2;
}

message GetSettingsReply {
  // Unset when the service has no version yet: the agent runs on its defaults.
  SettingVersion version = 1;
  repeated SettingValue values = 2;
}

message SaveSettingsRequest {
  string service = 1;
  // Every setting of the service, once each (settings.rs lists them).
  repeated SettingValue values = 2;
  string by = 3;
  // The Default version: number 0, at most one per service (ALREADY_EXISTS after that). It is
  // made active only when the service has no active version yet.
  bool seed = 4;
}

message SaveSettingsReply {
  SettingVersion version = 1;
}

message FileCallLine {
  // The record's id (its file name, without .jsonl). The same in every message of one stream.
  string call_id = 1;
  // One line of the record: a JSON event. The dev record keeps the call's words in full.
  string line = 2 [(phi) = true];
}

message FileCallReply {
  // False when the same record was already filed (the ingest is idempotent).
  bool filed = 1;
}

// Which EHR a call reads. It names a server, never a patient. A deploy serves its hospital's
// EHR only and refuses any other; dev serves both (CHAT.md §13).
enum EhrSource {
  // ehr's default: its own fakes today.
  EHR_SOURCE_UNSPECIFIED = 0;
  // ehr's fakes (ehr/fixtures/sandbox.json).
  EHR_SOURCE_LOCAL = 1;
  // Epic's public sandbox (EPIC.md §5.2). FAILED_PRECONDITION when ehr does not serve it.
  EHR_SOURCE_EPIC_SANDBOX = 2;
}

message OpenCallRequest {
  EhrSource ehr = 1;
  // The version of the agent's words this call runs with (CONSOLE.md §9): ehr takes the text
  // message's words (`text.code`) from it. 0: the prompt file compiled into ehr. A version id,
  // never words.
  int64 prompt_version = 2;
  // The version of the System variables this call runs with (SYSTEM-PAGE.md §3.4): ehr fills
  // them into the text message's words when the call opens. 0: the active version, or the
  // variables file compiled into ehr when the store has none. A version id, never values.
  int64 system_version = 3;
}

message OpenCallReply {
  string handle = 1 [(secret) = true];
  // This call's verification limits, in full (service.rs: MAX_IDENTIFIES, MAX_RESENDS,
  // MAX_CODE_FAILURES), so a reader never copies them. The replies that spend one say what is
  // left. Counts only, never a value.
  uint32 identifies_left = 2;
  uint32 resends_left = 3;
  uint32 code_tries_left = 4;
  // The hospital's date and time as the call opens, YYYY-MM-DDTHH:MM, in its time zone
  // (FUTURE-SETTINGS.md §13.1; the owner's 1A, 2026-11-14), and that zone's short name ("CST").
  // ehr holds the one time zone, so ehr and the agent agree on "today". Not protected data.
  string local_now = 5;
  string zone = 6;
}

message CloseCallRequest {
  string handle = 1 [(secret) = true];
}

message CloseCallReply {
  // The call's EHR ledger (docs/ops/DEBUGGING.md §3): each request ehr sent the EHR, in order.
  repeated EhrRequest ledger = 1;
}

// One request to the EHR. Names and counts only: never a value, an id or a patient.
message EhrRequest {
  // The gRPC call that sent it ("FindVisit").
  string rpc = 1;
  // "GET Appointment?date&patient&service-category&status": the resource and parameter names.
  string what = 2;
  // The HTTP status; 0 when no answer came.
  uint32 status = 3;
  uint32 ms = 4;
  uint32 results = 5;
  uint32 bytes = 6;
  // When it started, in milliseconds from the call's start in ehr.
  uint32 at_ms = 7;
}

message IdentifyRequest {
  string handle = 1 [(secret) = true];
  string given_name = 2 [(phi) = true];
  string family_name = 3 [(phi) = true];
  // YYYY-MM-DD.
  string birth_date = 4 [(phi) = true];
}

message IdentifyReply {
  // How many more times the caller may give a name and date of birth on this call.
  uint32 tries_left = 1;
}

message ResendCodeRequest {
  string handle = 1 [(secret) = true];
}

message ResendCodeReply {
  uint32 resends_left = 1;
}

message CheckCodeRequest {
  string handle = 1 [(secret) = true];
  // Six digits.
  string code = 2 [(secret) = true];
}

enum CheckOutcome {
  CHECK_OUTCOME_UNSPECIFIED = 0;
  // Both factors passed. The chart and booking calls are open.
  CHECK_OUTCOME_PASS = 1;
  // Wrong, expired, or no code was sent. The caller may try again.
  CHECK_OUTCOME_FAIL = 2;
  // Three failures: the chart path is closed for this call. Offer a person.
  CHECK_OUTCOME_LOCKED = 3;
}

message CheckCodeReply {
  CheckOutcome outcome = 1;
  uint32 tries_left = 2;
}

message FindSlotsRequest {
  string handle = 1 [(secret) = true];
  // What the visit is for, in the caller's words (the agent checks they are the caller's). ehr
  // keeps it for this call, and Book sends it to the scheduler as the visit's note.
  string reason = 2 [(phi) = true];
  // The earliest day the caller can come, YYYY-MM-DD. Empty: from the next open day.
  string earliest_day = 3 [(phi) = true];
  // How the caller wants to be seen, from their words (the owner's 1A, 2026-11-13). Unset:
  // either way. At Epic this becomes the hospital's visit types (EPIC.md §5.2).
  VisitMode visit_mode = 4;
  // The last day the caller can come, YYYY-MM-DD. Empty: no end (EPIC.md §7.10).
  string latest_day = 5 [(phi) = true];
  // A time of day from the hospital's list ("morning"); empty for any (FUTURE-SETTINGS.md §13.1).
  string time_of_day = 6 [(phi) = true];
  // Days of the week, "mon" to "sun"; none for any.
  repeated string days = 7;
  // The caller's words for a clinician; empty for any. The slots are narrowed to them.
  string clinician = 8 [(phi) = true];
  // The next slots of the last search, not a new search: every other field is ignored.
  bool more = 9;
}

enum VisitMode {
  VISIT_MODE_UNSPECIFIED = 0;
  VISIT_MODE_IN_PERSON = 1;
  VISIT_MODE_ONLINE = 2;
}

message FindSlotsReply {
  repeated Slot slots = 1;
  // More slots of the same search wait (FindSlots with `more`).
  bool more = 2;
}

message Slot {
  // Valid for this call's handle only, until the next FindSlots.
  string token = 1 [(secret) = true];
  // The start, local time at the place, YYYY-MM-DDTHH:MM.
  string starts_at = 2 [(phi) = true];
  uint32 minutes = 3;
  string clinician = 4 [(phi) = true];
  string place = 5 [(phi) = true];
  // An online visit (video or phone), from its visit type. The place is still the record's.
  bool online = 6;
}

message BookRequest {
  string handle = 1 [(secret) = true];
  string slot_token = 2 [(secret) = true];
  // Made by the agent, random, one per booking the caller asks for. A retry reuses it.
  string idempotency_key = 3;
}

enum BookOutcome {
  BOOK_OUTCOME_UNSPECIFIED = 0;
  BOOK_OUTCOME_BOOKED = 1;
  // Someone else took the slot between FindSlots and Book. Offer the others.
  BOOK_OUTCOME_SLOT_TAKEN = 2;
  // The EHR's reply was lost and a search found no booking (the owner's V2A, EPIC.md §7.10):
  // ask the caller whether to try again. A retry with the same key books.
  BOOK_OUTCOME_NOT_THROUGH = 3;
}

message BookReply {
  BookOutcome outcome = 1;
  // Set when the outcome is BOOKED.
  Slot booked = 2;
  // Set when the outcome is BOOKED: the visit as booked, with its type, whether it is online,
  // and the caller's reason that went to the scheduler as the visit's note (the last
  // FindSlots's reason; Epic's `appointmentNote`), after the sensitive screen.
  Visit visit = 3;
}

message FindVisitRequest {
  string handle = 1 [(secret) = true];
  // A day (YYYY-MM-DD) or a month (YYYY-MM) the caller named; "" for none.
  string when = 2 [(phi) = true];
  // The caller's words for the clinician ("Dr. Lin"); "" for none.
  string clinician = 3 [(phi) = true];
  // A visit that is over ("when was I last seen?").
  bool past = 4;
  // The caller's words for a visit group ("my imaging"); "" for none.
  string group = 5 [(phi) = true];
}

enum VisitStatus {
  // Still to come.
  VISIT_STATUS_UPCOMING = 0;
  VISIT_STATUS_SEEN = 1;
  VISIT_STATUS_MISSED = 2;
  VISIT_STATUS_CANCELLED = 3;
}

message Visit {
  // The start, local time at the place, YYYY-MM-DDTHH:MM.
  string starts_at = 1 [(phi) = true];
  uint32 minutes = 2;
  string clinician = 3 [(phi) = true];
  string place = 4 [(phi) = true];
  // The visit type as the record names it ("Office Visit"); "" when the record has none or
  // the visit is private.
  string visit_type = 5 [(phi) = true];
  // The reason for the visit; "" when the record has none or the visit is private.
  string reason = 6 [(phi) = true];
  // An online visit (video or phone). The place is still the record's.
  bool online = 7;
  // The type or reason named sensitive care (FUTURE-SETTINGS.md §9): both were dropped in ehr
  // and are "". The agent may say only that it cannot share what the visit is for.
  bool reason_private = 8;
  // How to prepare (Epic's `patientInstruction`, EPIC.md §7.8); "" for none or private.
  string instructions = 9 [(phi) = true];
  // The record held instructions and the screen dropped them.
  bool instructions_private = 10;
  // The visit's number at the hospital (Epic's CSN), for a staff flag only (FLAGS.md §3.3).
  // Never sent to the model. "" when unknown.
  string csn = 11 [(phi) = true];
  VisitStatus status = 12;
}

message FindVisitReply {
  // Unset when no visit matched, or when `groups` is set.
  Visit visit = 1;
  // How many others matched.
  uint32 more = 2;
  // Too many matched: the visit groups to ask the caller about, in order (FUTURE-SETTINGS.md
  // §13.3). The names are the hospital's; tied to this caller they say what their visits are.
  repeated string groups = 3 [(phi) = true];
  // With `groups`: other visits match outside the groups named ("or another visit").
  bool other_visits = 4;
  // `more` counts the visits in the next this many days (the window the search found the
  // visit in: 7, 30 or 90); 0: with no limit.
  uint32 more_within_days = 5;
}
