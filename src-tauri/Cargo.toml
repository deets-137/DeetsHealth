[package]
name = "deetshealth"
version = "0.1.0"
description = "A lightweight patient health-record viewer for Windows 11."
authors = ["Aditya Sundaram"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deetshealth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The web-ready core: sign-in, fetch, sealing, the store (docs/architecture/CORE-CRATE.md).
deetshealth-core = { path = "../core", features = ["sqlite"] }
# Wipes key bytes and unsealed values from memory (cng.rs, keystore.rs).
zeroize = "1"
# The fetch's waits (Retry-After, back-off) on the runtime Tauri already runs (fetch.rs).
tokio = { version = "1", features = ["time"] }
tauri = { version = "2", features = [] }
# One instance only: a second launch (the pinned taskbar button) must reach the running app,
# not start another.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local time on log lines (log.rs).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The WebView2 settings interface that turns off browser keys (lib.rs, release only). The
# version Tauri's wry already uses, so no new crate download.
webview2-com = "0.38"

[dependencies.windows]
version = "0.61"
# Win32_Security_Cryptography: CNG (AES-256-GCM, random, SHA-256) and DPAPI — the app's only
# crypto, from the OS's FIPS 140-validated module (SECURITY.md §4.6, cng.rs, keystore.rs).
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

[dev-dependencies]
# Only the live sign-in test (signin.rs, `--ignored`): it plays the browser's part.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
