[package]
name = "deetshealth-core"
version = "0.1.0"
description = "DeetsHealth's web-ready core: sign-in, fetch, sealing, the store and the normalizer."
authors = ["Aditya Sundaram"]
edition = "2021"

# No Tauri here, ever: this crate must also build for wasm32-unknown-unknown (CORE-CRATE.md §3).
[dependencies]
# Wipes a protected value from memory when it drops (SECURITY.md §8.2).
zeroize = "1"
# Constant-time comparison for a secret someone may guess at, the text code (Shielded::ct_eq).
# no_std, so the wasm build keeps it.
subtle = { version = "2", default-features = false }
# The desktop store (store/sqlite.rs): SQLite compiled in, the version DeetsMusic uses. Holds
# sealed values only. Behind a feature, so the wasm build never pulls it in.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# HTTP to the site (net.rs). TLS through the OS: SChannel on Windows (the `native-tls`
# feature), the browser's fetch on the web. gzip keeps replies small; `form` for the token
# request. No rustls, no bundled crypto. The TLS backend is a feature, on by default: `ehr` turns
# it off, because it never uses `Net` and would otherwise link OpenSSL on Linux (DEPENDENCIES.md
# §5, item 6).
reqwest = { version = "0.13", default-features = false, features = ["gzip", "form"] }
# Reading FHIR and SMART replies (net::parse_reply). preserve_order: the raw resource keeps the
# site's own key order (DATA-MODEL.md §2: store what the site gives, as it gives it).
serde_json = { version = "1", features = ["preserve_order"] }
# `join_all` for the fetch's three workers (sync.rs). Runtime-free, so it also runs on the web;
# already in the build through reqwest.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The card payloads and events the front end receives (payload.rs). Shielded<T> never
# implements Serialize, so only the plain payload structs can be sent.
serde = { version = "1", features = ["derive"] }
# TypeScript types for the payloads (CORE-CRATE.md §9, fork 8a). Build time only: behind the
# `ts` feature, which only `npm run types` turns on. The app never links it.
ts-rs = { version = "12", optional = true }

[build-dependencies]
# build.rs reads epic-client.json (EPIC.md §2). Already in the tree as a dependency above.
serde_json = "1"

[features]
default = ["native-tls"]
# TLS for `Net` through the OS (SChannel on Windows, OpenSSL on Linux). The patient app's.
native-tls = ["reqwest/native-tls"]
sqlite = ["dep:rusqlite"]
# The dev inspector (dev.rs): reads a sealed store for the developer. Never in a release.
dev = ["sqlite"]
ts = ["dep:ts-rs"]
