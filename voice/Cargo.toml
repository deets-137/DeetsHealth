[package]
name = "deetshealth-voice"
version = "0.1.0"
description = "DeetsHealth's voice catalog: each voice vendor, its levers and its costs, and the voice settings they make (docs/architecture/VOICE-VENDORS.md)."
authors = ["Aditya Sundaram"]
edition = "2021"
license = "MIT"
# Never on crates.io (an app's crate, not a library; deny.toml's bans read this).
publish = false

[dependencies]
# The catalog files (catalog/*.json) and the settings' values. Both are already in ehr's tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
